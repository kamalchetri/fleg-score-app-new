name: FLEG NSPG Android verification (no OTA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Expo compatibility
        run: npx expo-doctor
      - name: Verify live NSPG public Supabase catalogue
        run: node scripts/verify-nspg-catalog.mjs
