name: FLEG standalone Android preview APK (no OTA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ota-bootstrap-once.yml
      - app/**
      - components/**
      - lib/**
      - assets/**
      - package.json
      - package-lock.json
      - app.json

permissions:
  contents: read

jobs:
  build-standalone-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_REVIEW_BUILD: 'false'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and tests
        run: |
          npm run typecheck
          npm test
          npx expo-doctor
          node scripts/verify-nspg-catalog.mjs
      - name: Configure Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` SDK package no longer exists.
          packages: 'platform-tools'
      - name: Set live Supabase public environment for standalone bundle
        shell: bash
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$(node -p 'require("./eas.json").build.preview.env.EXPO_PUBLIC_SUPABASE_URL')" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(node -p 'require("./eas.json").build.preview.env.EXPO_PUBLIC_SUPABASE_ANON_KEY')" >> "$GITHUB_ENV"
      - name: Prepare separate non-OTA Android preview app
        shell: bash
        run: |
          # Use a distinct package to avoid replacing an existing signed app
          # with a test build signed using Android debug credentials.
          cat > app.config.js <<'JS'
          const base = require("./app.json").expo;
          module.exports = {
            expo: {
              ...base,
              name: "Fleg Score Preview",
              scheme: "flegscorepreview",
              android: { ...base.android, package: "in.fleg.score.preview" },
              updates: { enabled: false, checkAutomatically: "NEVER" },
            },
          };
          JS
      - name: Generate native Android project (without EAS)
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build signed test APK using Gradle (no EAS build quota)
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify generated APK is signed and installable
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi
          apksigner="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Android apksigner is unavailable"
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "${apks[0]}"
          echo "Verified standalone Android APK signature." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: fleg-score-preview-no-ota-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
